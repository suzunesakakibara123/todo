<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ToDOアプリ：CRUD</title>
</head>

<body>

    <h1>みんなのタスクボード</h1>

    <!--登録・更新完了メッセージ-->
    <p th:if="${complete}" th:text="${complete}" style="color:blue"></p>

    
    <br>

    <hr>  
    <!--新規登録時のみ表示-->
    <div th:if="${todoForm.newTodo}" style="margin: 10px">

        <h3>
            登録タスク一覧：
            <a th:href="@{/todo/done}">実施済タスク履歴一覧</a><br>
        </h3>

        <!--削除完了メッセージ-->
        <p th:if="${delcomplete}"
           th:text="${delcomplete}"
           style="color:blue">
        </p>

        <p th:if="${msg}"
           th:text="${msg}"
           style="color:red">
        </p>

        <!--タスク情報が1件以上ある場合-->

        <table border="1"
               th:unless="${#lists.isEmpty(list)}"
               style="table-layout: fixed;">

            <tr>
                <th>番号</th>
				<th>担当者</th>
                <th>期限</th>
                <th>タスク内容</th>
				<th>編集</th>
				<th>優先</th>
                <th>終わったらチェック</th>
                <th>削除</th>
            </tr>

            <tr th:each="obj : ${list}" align="center">

				<!--id番号-->
                <td th:text="${obj.id}"></td>
				
				<!--担当者-->
				<td th:text="${obj.user}"></td>

				<!--期限-->
                <td th:text="${obj.deadline}"></td>
				
				<!--タスク内容-->
				<td th:text="${obj.content}"
								    th:style="${obj.priority} ? 'color:red; font-weight:bold;' : ''"
								    align="left">
								</td>

                <!--編集ボタン-->
                <td>

                    <form method="GET"
                          th:action="@{/todo/{id}(id=${obj.id})}">

                        <input type="submit" value="✎">

                    </form>

                </td>
				
				<!--優先度チェックボックス-->
				<td>
				    <form method="POST" th:action="@{/todo/priority}">
				        <input type="hidden" name="id" th:value="${obj.id}">

				        <input type="checkbox"
				               th:checked="${obj.priority}"
				               onchange="this.form.submit()">
				    </form>
				</td>
				
				<!--完了チェックボックス-->
				<td>
				    <form method="POST" th:action="@{/todo/done}">
				        <input type="hidden" name="id" th:value="${obj.id}">

				        <input type="checkbox"
				               th:checked="${obj.done}"
				               onchange="this.form.submit()">
				    </form>
				</td>

                <!--削除ボタン-->
                <td>

                    <form method="POST"
                          th:action="@{/todo/delete}">

                        <input type="hidden"
                               name="id"
                               th:value="${obj.id}">

                        <input type="submit" value="削除">

                    </form>

                </td>

            </tr>

        </table>

		<br>
		
		
        <!-- タスク情報が1件もない場合表示-->

        <p th:if="${#lists.isEmpty(list)}">
            登録されているタスクはありません。
        </p>
		
		<br>

		<!-- 今日のタスクのみを表示 -->
		<form method="GET" th:action="@{/todo/today}" style="display:inline;">
		    <input type="submit" value="今日が期限のタスクのみ表示">
		</form>

		<!-- 期限が近い順に並び替える -->
		<form method="GET" th:action="@{/todo/sort/deadline}" style="display:inline;">
		    <input type="submit" value="期限が近い順で表示">
		</form>

		<!-- 通常表示に戻す -->
		<form method="GET" th:action="@{/todo}" style="display:inline;">
		    <input type="submit" value="通常表示に戻す">
		</form>

		<!-- 新規タスク追加ボタン -->
		<form method="GET" th:action="@{/todo/create}" style="display:inline;">
		    <input type="submit" value="＋ タスクを追加する">
		</form>

    </div>


</body>

</html>
